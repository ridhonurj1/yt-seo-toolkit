[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytseo"
version = "0.1.0"
description = "YouTube SEO & metadata toolkit via YouTube Data API v3"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "Pillow>=10.0.0",
]

[project.scripts]
ytseo = "ytseo.cli:main"

[tool.setuptools.packages.find]
include = ["ytseo*"]
